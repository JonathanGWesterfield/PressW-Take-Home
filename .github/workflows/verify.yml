name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend:
        type: choice
        options: [legacy, encore, gateway, both]
        default: legacy
jobs:
  verification:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: legacy
            check: Direct legacy and modern
          - backend: encore
            check: Direct Encore and modern
          - backend: gateway
            check: Gateway ingress and mixed routing
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated stack
        run: python3 scripts/verify --backend "${{ matrix.backend }}"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
  manual-verification:
    if: github.event_name == 'workflow_dispatch'
    name: Manual verification (${{ inputs.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected isolated stack
        run: python3 scripts/verify --backend "${{ inputs.backend }}"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-manual-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
