[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: isolated tests with no live services
    e2e: tests using running HTTP services or Postgres
    smoke: small live service availability checks
    characterization: observed legacy behavior and golden response contracts
    mutates_db: tests that write database rows, including fixture setup/cleanup
    fuzz: bounded Hypothesis exploration (frozen minimized regressions remain characterization tests)
